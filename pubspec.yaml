name: scribe_supereditor_prototype
description: Standalone Android writing-editor prototype using SuperEditor for Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  attributed_text: 0.4.7
  collection: ^1.18.0
  follow_the_leader: 0.5.3
  image_picker: ^1.1.2
  markdown: ^7.2.1
  path: ^1.9.0
  path_provider: ^2.1.5
  super_editor: 0.3.0-dev.52
  super_text_layout: 0.1.20
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
